# Spec: SPEC-000 §4; Plan P1 §1.1; vision Developer README, Installation.
[project]
name = "agent-harness"
version = "0.1.0"
description = "Local-first autonomous agent execution framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.12.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=4.0",
    "pdfkit>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
anthropic = ["anthropic>=0.18.0"]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
]

[tool.setuptools.package-data]
# The UI ships as plain HTML/CSS/JS served from the package: no bundler, no CDN,
# so the interface works offline (PRD G6).
"agent_harness.web" = ["static/*.html", "static/*.css", "static/*.js"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_harness", "agent_harness.*"]
namespaces = true

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: composed system tests with stubbed external services"]

[tool.coverage.report]
fail_under = 80
show_missing = true
